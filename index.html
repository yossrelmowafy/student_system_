<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر يسر الموافي - نظام المحاسبة وإدارة الأعمال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
       .hero-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.60)), url('https://raw.githubusercontent.com/yossrelmowafy/student_system/main/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body id="page-body" class="hero-bg text-white min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div id="main-card" class="bg-white/10 dark:bg-slate-950/20 text-gray-900 dark:text-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-5xl text-center space-y-6 backdrop-blur-md border border-white/20 dark:border-slate-700/30 transition-colors duration-300">
        
        <!-- رأس الصفحة -->
        <div class="flex justify-between items-center border-b pb-4 border-white/20 dark:border-slate-800/50">
            <div class="text-right">
                <h2 class="text-2xl font-black text-blue-400 dark:text-blue-400 tracking-wider drop-shadow-md">مستر يسر الموافي</h2>
                <p class="text-xs text-gray-200 dark:text-gray-300 font-bold mt-1 drop-shadow">نظام المحاسبة وإدارة الأعمال - نظام البكالوريا (دفعة 2027)[cite: 1]</p>
            </div>
            <button onclick="playClickSound(); toggleDarkMode()" class="bg-black/30 dark:bg-slate-800/50 text-white p-2.5 rounded-2xl text-xl transition shadow hover:scale-105 border border-white/10" title="تبديل الوضع الليلي">
                <span id="theme-icon">🌙</span>
            </button>
        </div>

        <!-- أزرار الاختيار بين الوضعين -->
        <div id="mode-selector" class="flex gap-4 justify-center border-b pb-4 border-white/20 dark:border-slate-800/50">
            <button onclick="playClickSound(); switchMode('student')" id="btn-mode-student" class="flex-1 bg-blue-600/90 hover:bg-blue-600 text-white py-3.5 rounded-2xl font-bold transition shadow-lg text-sm flex items-center justify-center gap-2 border border-blue-400/30">
                <i class="fa-solid fa-graduation-cap"></i> بوابة الطالب الذكية
            </button>
            <button onclick="playClickSound(); requestAdminAccess()" id="btn-mode-admin" class="flex-1 bg-black/20 dark:bg-slate-800/40 text-gray-100 dark:text-gray-200 py-3.5 rounded-2xl font-bold transition shadow-lg text-sm flex items-center justify-center gap-2 border border-white/10">
                <i class="fa-solid fa-user-shield"></i> لوحة تحكم المشرف الشاملة
            </button>
        </div>

        <!-- حاوية المحتوى الديناميكي -->
        <div id="main-container"></div>

    </div>

    <!-- نافذة عرض الكارنيه أو التقارير المنبثقة -->
    <div id="print-card-area" class="hidden"></div>

    <script>
        const ADMIN_WHATSAPP = "201015706200";
        let currentActiveMode = 'student';

        // دالة مركزية لجلب البيانات بضمان القراءة المباشرة
        function getData(key, defaultVal) {
            const val = localStorage.getItem(key);
            return val ? JSON.parse(val) : defaultVal;
        }

        function saveData(key, val) {
            localStorage.setItem(key, JSON.stringify(val));
        }

        let isDarkMode = localStorage.getItem('yossr_dark_mode') === 'true';
        if (isDarkMode) { applyDarkMode(true); }

        // مزامنة تلقائية سريعة كل نصف ثانية لضمان ظهور الطلبات للمشرف فور إرسالها
        setInterval(() => {
            if (currentActiveMode === 'admin') {
                renderAdminView();
            } else if (currentActiveMode === 'student') {
                const codeInput = document.getElementById('portal-code-input');
                if (codeInput && codeInput.value.trim() !== '') {
                    updateStudentPendingView(codeInput.value.trim().toUpperCase());
                }
            }
        }, 500);

        window.addEventListener('DOMContentLoaded', () => {
            switchMode('student');
            const urlParams = new URLSearchParams(window.location.search);
            const studentCodeFromURL = urlParams.get('code');

            if (studentCodeFromURL) {
                const cleanCode = studentCodeFromURL.trim().toUpperCase();
                setTimeout(() => {
                    const codeInput = document.getElementById('portal-code-input');
                    if (codeInput) {
                        codeInput.value = cleanCode;
                        loadStudentPortalData();
                        requestAttendanceAuto(cleanCode);
                    }
                }, 300);
            }
        });

        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function playSuccessSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('yossr_dark_mode', isDarkMode);
            applyDarkMode(isDarkMode);
        }

        function applyDarkMode(dark) {
            const card = document.getElementById('main-card');
            const icon = document.getElementById('theme-icon');
            if (dark) {
                card.classList.add('dark');
                icon.textContent = "☀️";
            } else {
                card.classList.remove('dark');
                icon.textContent = "🌙";
            }
        }

        function switchMode(mode) {
            stopStudentQrScanner();
            currentActiveMode = mode;
            const studentBtn = document.getElementById('btn-mode-student');
            const adminBtn = document.getElementById('btn-mode-admin');

            if (mode === 'student') {
                studentBtn.className = "flex-1 bg-blue-600/90 hover:bg-blue-600 text-white py-3.5 rounded-2xl font-bold transition shadow-lg text-sm flex items-center justify-center gap-2 border border-blue-400/30";
                adminBtn.className = "flex-1 bg-black/20 dark:bg-slate-800/40 text-gray-100 dark:text-gray-200 py-3.5 rounded-2xl font-bold transition shadow-lg text-sm flex items-center justify-center gap-2 border border-white/10";
                renderStudentView();
            } else if (mode === 'admin') {
                adminBtn.className = "flex-1 bg-blue-600/90 hover:bg-blue-600 text-white py-3.5 rounded-2xl font-bold transition shadow-lg text-sm flex items-center justify-center gap-2 border border-blue-400/30";
                studentBtn.className = "flex-1 bg-black/20 dark:bg-slate-800/40 text-gray-100 dark:text-gray-200 py-3.5 rounded-2xl font-bold transition shadow-lg text-sm flex items-center justify-center gap-2 border border-white/10";
                renderAdminView();
            }
        }

        function requestAdminAccess() {
            const pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === "23122002YY") {
                switchMode('admin');
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // ================= 1. بوابة الطالب الذكية =================
        function renderStudentView() {
            const container = document.getElementById('main-container');
            const todayName = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            let schedules = getData('yossr_schedules', [
                { subject: "المحاسبة", days: "السبت والأربعاء", time: "2:00 ظهراً" },
                { subject: "إدارة الأعمال", days: "الأحد والثلاثاء", time: "4:00 عصراً" }
            ]);

            let scheduleHtml = '';
            let marqueeText = "أهلاً بك يا بطل في نظام مستر يسر الموافي للمحاسبة وإدارة الأعمال[cite: 1]! 📚✨ | ";
            
            schedules.forEach(sch => {
                scheduleHtml += `<p>• <b>${sch.subject}:</b> ${sch.days} (${sch.time})</p>`;
                marqueeText += `موعد حصة ${sch.subject}: ${sch.days} الساعة ${sch.time} ⏱️ | `;
            });

            container.innerHTML = `
                <div class="space-y-6 text-right max-w-xl mx-auto">
                    <div class="bg-blue-950/70 border border-blue-500/40 rounded-2xl overflow-hidden py-2 px-3 shadow-sm backdrop-blur-sm">
                        <marquee behavior="scroll" direction="right" scrollamount="4" class="text-xs font-bold text-blue-200">
                            <i class="fa-solid fa-bullhorn text-amber-400 ml-1"></i> ${marqueeText}
                        </marquee>
                    </div>

                    <div class="bg-black/20 dark:bg-slate-900/40 p-4 rounded-2xl border border-white/20 dark:border-slate-700/50 flex justify-between items-center text-xs shadow-sm backdrop-blur-sm">
                        <span class="font-bold text-white"><i class="fa-solid fa-calendar-day ml-1"></i> ${todayName}</span>
                        <span class="font-bold text-blue-300">مرحباً بك في بوابة التفوق والتميز</span>
                    </div>

                    <div class="bg-black/25 dark:bg-slate-900/50 p-5 rounded-2xl border border-white/20 dark:border-slate-700/60 space-y-3 shadow-inner backdrop-blur-sm">
                        <label class="block font-bold text-xs text-white">أدخل كودك الشخصي أو امسح كارت الحضور:</label>
                        <div class="flex gap-2">
                            <input type="text" id="portal-code-input" placeholder="مثال: YOSSR-101" class="flex-1 px-4 py-2.5 border rounded-xl text-xs uppercase font-mono font-bold bg-black/30 dark:bg-slate-950/70 text-white placeholder-gray-300 border-white/30 dark:border-slate-700">
                            <button onclick="playClickSound(); loadStudentPortalData()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow border border-blue-400/30">استعلام</button>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="playClickSound(); startStudentQrScanner()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-emerald-400/30">
                                <i class="fa-solid fa-qrcode"></i> مسح كود الكارنيه (QR) بالكاميرا
                            </button>
                            <button onclick="playClickSound(); stopStudentQrScanner()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition">إغلاق</button>
                        </div>
                        <div id="student-qr-reader" class="w-full max-w-xs mx-auto bg-black rounded-xl overflow-hidden"></div>
                    </div>

                    <div id="student-portal-details" class="hidden space-y-4">
                        <div id="portal-financial-alert-banner"></div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-black/20 dark:bg-slate-950/40 p-4 rounded-2xl border border-white/20 dark:border-slate-700 shadow-sm backdrop-blur-sm">
                                <span class="text-[11px] text-gray-300 block mb-1">المدفوعات المسجلة:</span>
                                <div id="portal-fin-badge"></div>
                            </div>
                            <div class="bg-black/20 dark:bg-slate-950/40 p-4 rounded-2xl border border-white/20 dark:border-slate-700 shadow-sm backdrop-blur-sm">
                                <span class="text-[11px] text-gray-300 block mb-1">حصص الحضور المعتمدة:</span>
                                <span id="portal-att-count" class="font-black text-base text-blue-300">0 حصة</span>
                            </div>
                        </div>

                        <div class="bg-emerald-950/40 dark:bg-slate-900/60 p-4 rounded-2xl border border-emerald-500/30 dark:border-slate-700 space-y-3 backdrop-blur-sm">
                            <h3 class="font-bold text-xs text-emerald-300">تسجيل حضور حصة اليوم:</h3>
                            <button onclick="playClickSound(); requestAttendanceApproval()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs shadow transition flex items-center justify-center gap-2 border border-emerald-400/30">
                                <i class="fa-solid fa-check-circle"></i> إرسال طلب تسجيل الحضور للمشرف
                            </button>
                            <div id="attendance-alert-box"></div>
                        </div>

                        <div class="bg-indigo-950/40 dark:bg-slate-900/60 p-4 rounded-2xl border border-indigo-500/30 dark:border-slate-700 space-y-3 backdrop-blur-sm">
                            <h3 class="font-bold text-xs text-indigo-300">إرسال طلب سداد (اشتراك / مذكرة / امتحان):</h3>
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                                <select id="pay-type" class="px-3 py-2.5 border rounded-xl text-xs bg-black/30 dark:bg-slate-950 text-white border-white/30 dark:border-slate-700">
                                    <option value="اشتراك الشهر" class="text-black">اشتراك الشهر</option>
                                    <option value="رسوم مذكرة" class="text-black">رسوم مذكرة</option>
                                    <option value="رسوم امتحانات" class="text-black">رسوم امتحانات</option>
                                </select>
                                <select id="pay-subject" class="px-3 py-2.5 border rounded-xl text-xs bg-black/30 dark:bg-slate-950 text-white border-white/30 dark:border-slate-700">
                                    <option value="المحاسبة" class="text-black">المحاسبة</option>
                                    <option value="إدارة الأعمال" class="text-black">إدارة الأعمال</option>
                                </select>
                                <select id="pay-month" class="px-3 py-2.5 border rounded-xl text-xs bg-black/30 dark:bg-slate-950 text-white border-white/30 dark:border-slate-700">
                                    <option value="سبتمبر" class="text-black">سبتمبر</option><option value="أكتوبر" class="text-black">أكتوبر</option><option value="نوفمبر" class="text-black">نوفمبر</option><option value="ديسمبر" class="text-black">ديسمبر</option><option value="يناير" class="text-black">يناير</option><option value="فبراير" class="text-black">فبراير</option><option value="مارس" class="text-black">مارس</option><option value="أبريل" class="text-black">أبريل</option><option value="مايو" class="text-black">مايو</option><option value="يونيو" class="text-black">يونيو</option><option value="يوليو" class="text-black">يوليو</option><option value="أغسطس" class="text-black">أغسطس</option>
                                </select>
                                <input type="number" id="pay-amount" placeholder="المبلغ (ج)" class="px-3 py-2.5 border rounded-xl text-xs bg-black/30 dark:bg-slate-950 text-white placeholder-gray-300 border-white/30 dark:border-slate-700">
                            </div>
                            <button onclick="playClickSound(); requestPaymentApproval()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs shadow transition flex items-center justify-center gap-2 border border-indigo-400/30">
                                <i class="fa-solid fa-paper-plane"></i> إرسال طلب السداد للمشرف (قيد المراجعة)
                            </button>
                            <div id="payment-alert-box"></div>
                        </div>

                        <div class="bg-amber-950/40 dark:bg-slate-900/60 p-4 rounded-2xl border border-amber-500/30 dark:border-slate-700 space-y-2 backdrop-blur-sm">
                            <h4 class="font-bold text-xs text-amber-300"><i class="fa-solid fa-clock ml-1"></i> متابعة طلباتك المعلقة:</h4>
                            <div id="student-pending-status-box" class="text-[11px] text-gray-200 space-y-1">جاري التحقق...</div>
                        </div>

                        <div class="bg-black/20 dark:bg-slate-900/60 p-4 rounded-2xl border border-white/20 dark:border-slate-700 space-y-2 backdrop-blur-sm">
                            <h4 class="font-bold text-xs text-white"><i class="fa-solid fa-calendar-days ml-1"></i> جدول مواعيد المجموعات الثابت:</h4>
                            <div class="text-[11px] text-gray-200 space-y-1">${scheduleHtml}</div>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="playClickSound(); copyStudentCode()" class="flex-1 bg-slate-800/80 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-white/20">
                                <i class="fa-solid fa-copy"></i> نسخ الكود
                            </button>
                            <button onclick="playClickSound(); openStudentCard()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-sky-400/30">
                                <i class="fa-solid fa-id-card"></i> عرض كارت الحضور والـ QR
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            <a href="https://chat.whatsapp.com/CHQTsKqmsRSK0jJqkHU4Ou" target="_blank" onclick="playClickSound()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow transition border border-emerald-400/30">
                                <i class="fa-brands fa-whatsapp text-sm"></i> الانضمام لجروب الواتساب[cite: 1]
                            </a>
                            <a id="direct-wa-support" href="#" target="_blank" onclick="playClickSound()" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow transition border border-slate-500/30">
                                <i class="fa-brands fa-whatsapp text-sm"></i> تواصل مباشر مع الإدارة
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        let studentHtml5QrCode = null;
        function startStudentQrScanner() {
            if (!studentHtml5QrCode) { studentHtml5QrCode = new Html5Qrcode("student-qr-reader"); }
            studentHtml5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 200 },
                (decodedText) => {
                    const rawCode = decodedText.trim();
                    const parts = rawCode.split('/');
                    const cleanCode = parts[parts.length - 1].replace('?code=', '').trim().toUpperCase();

                    let students = getData('yossr_students', [{ name: "أحمد محمد علي", code: "YOSSR-101", phone: "01012345678", active: true }]);
                    let student = students.find(s => s.code.toUpperCase() === cleanCode);
                    if (!student) {
                        student = { name: "طالب مسجل بالكاميرا (" + cleanCode + ")", code: cleanCode, phone: "غير محدد", active: true };
                        students.push(student);
                        saveData('yossr_students', students);
                    }

                    playSuccessSound();
                    document.getElementById('portal-code-input').value = student.code;
                    stopStudentQrScanner();
                    loadStudentPortalData();
                    requestAttendanceAuto(student.code);
                },
                (err) => {}
            ).catch(err => alert("تأكد من إذن استخدام الكاميرا."));
        }

        function stopStudentQrScanner() {
            if (studentHtml5QrCode) { studentHtml5QrCode.stop().catch(err => {}); }
        }

        function loadStudentPortalData() {
            const code = document.getElementById('portal-code-input').value.trim().toUpperCase();
            if (!code) { alert("أدخل كود الطالب أو امسح الكارنيه أولاً!"); return; }
            
            let students = getData('yossr_students', []);
            let student = students.find(s => s.code.toUpperCase() === code);
            
            if (!student) {
                student = { name: "طالب مسجل (" + code + ")", code: code, phone: "غير محدد", active: true };
                students.push(student);
                saveData('yossr_students', students);
            }

            document.getElementById('student-portal-details').classList.remove('hidden');

            let mySubs = getData('yossr_subscriptions', []).filter(s => s.code.toUpperCase() === student.code.toUpperCase());
            let totalPaid = 0;
            mySubs.forEach(s => totalPaid += s.amount);

            let myDues = getData('yossr_student_dues', []).filter(d => d.code.toUpperCase() === student.code.toUpperCase() || d.code === "ALL");
            let totalDue = 0;
            myDues.forEach(d => totalDue += d.amount);

            let remainingDue = totalDue - totalPaid;
            const alertBanner = document.getElementById('portal-financial-alert-banner');

            if (remainingDue > 0) {
                alertBanner.innerHTML = `<div class="bg-rose-950/60 border border-rose-500/40 p-3.5 rounded-2xl flex items-center justify-between text-xs shadow-sm"><div class="flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-rose-400 text-base"></i><div><span class="font-bold text-rose-200 block">تنبيه مالي مهم:</span><span class="text-rose-300">عليك مصروفات مستحقة بقيمة <b class="font-black underline">${remainingDue} ج.م</b></span></div></div></div>`;
            } else {
                alertBanner.innerHTML = `<div class="bg-emerald-950/60 border border-emerald-500/40 p-3.5 rounded-2xl flex items-center gap-2 text-xs shadow-sm"><i class="fa-solid fa-circle-check text-emerald-400 text-base"></i><span class="font-bold text-emerald-200">حسابك ماليًا مستقر ولا توجد مصروفات متأخرة.</span></div>`;
            }

            document.getElementById('portal-fin-badge').innerHTML = `<span class="bg-emerald-900/80 text-emerald-200 px-2.5 py-1 rounded-lg text-xs font-bold border border-emerald-500/30">إجمالي المدفوع (${totalPaid}ج)</span>`;

            let myAtt = getData('yossr_approved_att', []).filter(a => a.code.toUpperCase() === student.code.toUpperCase());
            document.getElementById('portal-att-count').innerText = `${myAtt.length} حصة`;

            updateStudentPendingView(student.code);
            document.getElementById('direct-wa-support').href = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(`السلام عليكم مستر يسر، أنا الطالب/ة ${student.name} (كود: ${student.code}) وعندي استفسار.`)}`;
        }

        function updateStudentPendingView(code) {
            const box = document.getElementById('student-pending-status-box');
            if(!box) return;
            let pendingAttendance = getData('yossr_pending_att', []);
            let pendingPayments = getData('yossr_pending_pay', []);

            let pendingAttObj = pendingAttendance.find(a => a.code.toUpperCase() === code.toUpperCase());
            let pendingPayList = pendingPayments.filter(p => p.code.toUpperCase() === code.toUpperCase());

            let html = "";
            if (pendingAttObj) {
                html += `<p class="text-amber-300 font-bold">• طلب تسجيل الحضور: <b>قيد المراجعة ⏳</b></p>`;
            } else {
                html += `<p class="text-gray-300">• لا يوجد طلب حضور معلق اليوم.</p>`;
            }

            if (pendingPayList.length > 0) {
                pendingPayList.forEach(p => {
                    html += `<p class="text-indigo-300 font-bold">• طلب دفع (${p.type} - ${p.amount}ج): <b>قيد المراجعة ⏳</b></p>`;
                });
            } else {
                html += `<p class="text-gray-300">• لا توجد طلبات دفع معلقة.</p>`;
            }
            box.innerHTML = html;
        }

        function requestAttendanceAuto(code) {
            let students = getData('yossr_students', []);
            let student = students.find(s => s.code.toUpperCase() === code);
            if (!student) {
                student = { name: "طالب بالكارت (" + code + ")", code: code, phone: "غير محدد", active: true };
                students.push(student);
                saveData('yossr_students', students);
            }

            let pendingAttendance = getData('yossr_pending_att', []);
            let approvedAttendance = getData('yossr_approved_att', []);
            const todayStr = new Date().toLocaleDateString('ar-EG');
            
            const alreadyAttended = approvedAttendance.some(a => a.code.toUpperCase() === student.code.toUpperCase() && a.date.includes(todayStr));
            const alreadyPending = pendingAttendance.some(a => a.code.toUpperCase() === student.code.toUpperCase());
            const alertBox = document.getElementById('attendance-alert-box');

            if (alreadyAttended) {
                if(alertBox) alertBox.innerHTML = `<div class="p-2.5 bg-blue-900/85 text-blue-200 rounded-xl text-xs font-bold text-center">ℹ️ تم تسجيل حضورك مسبقاً اليوم.</div>`;
                return;
            }
            if (alreadyPending) {
                if(alertBox) alertBox.innerHTML = `<div class="p-2.5 bg-amber-900/85 text-amber-200 rounded-xl text-xs font-bold text-center">⏳ طلب حضورك مسجل بالفعل وقيد المراجعة.</div>`;
                return;
            }

            pendingAttendance.push({ name: student.name, code: student.code, date: new Date().toLocaleString('ar-EG') });
            saveData('yossr_pending_att', pendingAttendance);
            
            if(alertBox) {
                alertBox.innerHTML = `<div class="p-2.5 bg-emerald-950 text-emerald-200 border border-emerald-500 rounded-xl text-xs font-bold text-center">🎉 تم إرسال طلب تسجيل الحضور للمشرف بنجاح!</div>`;
            }
            playSuccessSound();
            updateStudentPendingView(student.code);
        }

        function requestAttendanceApproval() {
            const code = document.getElementById('portal-code-input').value.trim().toUpperCase();
            if(!code) { alert("أدخل كود الطالب أولاً!"); return; }
            requestAttendanceAuto(code);
        }

        function requestPaymentApproval() {
            const code = document.getElementById('portal-code-input').value.trim().toUpperCase();
            const type = document.getElementById('pay-type').value;
            const subject = document.getElementById('pay-subject').value;
            const month = document.getElementById('pay-month').value;
            const amount = parseFloat(document.getElementById('pay-amount').value) || 0;
            const alertBox = document.getElementById('payment-alert-box');

            if (amount <= 0) { alert("أدخل مبلغ صحيح!"); return; }
            let students = getData('yossr_students', []);
            let student = students.find(s => s.code.toUpperCase() === code);
            if (!student) {
                student = { name: "طالب جديد", code: code, phone: "غير محدد", active: true };
                students.push(student);
                saveData('yossr_students', students);
            }

            let pendingPayments = getData('yossr_pending_pay', []);
            pendingPayments.push({ name: student.name, code: student.code, type, subject, month, amount, date: new Date().toLocaleString('ar-EG') });
            saveData('yossr_pending_pay', pendingPayments);

            alertBox.innerHTML = `<div class="p-2.5 bg-indigo-900/80 text-indigo-200 rounded-xl text-xs font-bold">⏳ تم إرسال طلب السداد للمشرف (قيد المراجعة).</div>`;
            updateStudentPendingView(student.code);
        }

        function copyStudentCode() {
            navigator.clipboard.writeText(document.getElementById('portal-code-input').value.trim()).then(() => alert("تم نسخ الكود بنجاح."));
        }

        function openStudentCard() {
            const code = document.getElementById('portal-code-input').value.trim().toUpperCase();
            let student = getData('yossr_students', []).find(s => s.code.toUpperCase() === code) || { name: "طالب جديد", code: code };
            showStudentCardModal(student.name, student.code);
        }

        function showStudentCardModal(name, code) {
            const area = document.getElementById('print-card-area');
            area.className = "fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm";
            area.innerHTML = `
                <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-sm text-center space-y-4 shadow-2xl text-white">
                    <h3 class="text-lg font-black text-blue-400">كارنيه طالب معتمد</h3>
                    <div id="qr-card-preview" class="bg-white p-4 rounded-2xl w-48 h-48 mx-auto flex items-center justify-center"></div>
                    <div><p class="font-bold text-base">${name}</p><p class="text-xs font-mono text-gray-400 mt-1">${code}</p></div>
                    <div class="flex gap-2">
                        <button onclick="downloadStudentCard()" class="flex-1 bg-blue-600 hover:bg-blue-700 py-2.5 rounded-xl text-xs font-bold transition">تحميل الكارنيه</button>
                        <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-800 py-2.5 rounded-xl text-xs font-bold transition">إغلاق</button>
                    </div>
                </div>
            `;
            new QRCode(document.getElementById("qr-card-preview"), { text: window.location.origin + window.location.pathname + "?code=" + code, width: 160, height: 160 });
        }

        function downloadStudentCard() {
            html2canvas(document.querySelector('#qr-card-preview').parentNode).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Student_Card.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function closeModal() {
            document.getElementById('print-card-area').className = "hidden";
            document.getElementById('print-card-area').innerHTML = "";
        }

        // ================= 2. لوحة تحكم المشرف الشاملة =================
        function renderAdminView() {
            const container = document.getElementById('main-container');
            let students = getData('yossr_students', [{ name: "أحمد محمد علي", code: "YOSSR-101", phone: "01012345678", active: true }]);
            let pendingAttendance = getData('yossr_pending_att', []);
            let approvedAttendance = getData('yossr_approved_att', []);
            let pendingPayments = getData('yossr_pending_pay', []);
            let subscriptions = getData('yossr_subscriptions', []);
            let expenses = getData('yossr_expenses', []);
            let schedules = getData('yossr_schedules', []);

            let totalExp = expenses.reduce((sum, e)=>sum+e.amount, 0);

            let adminScheduleHtml = '';
            schedules.forEach((sch, idx) => {
                adminScheduleHtml += `<div class="flex justify-between items-center bg-black/20 p-2.5 rounded-xl border border-white/10 text-xs"><span><b>${sch.subject}:</b> ${sch.days} (${sch.time})</span><button onclick="deleteSchedule(${idx})" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button></div>`;

            container.innerHTML = `
                <div class="space-y-6 text-right">

                        <div>
                            <h4 class="font-bold text-xs text-rose-300"><i class="fa-solid fa-triangle-exclamation ml-1"></i> منطقة التحكم الخطرة:</h4>
                            <p class="text-[11px] text-gray-300">تصفير كافة البيانات، الطلبات، والطلاب والبدء من جديد.</p>
                        </div>
                        <button onclick="playClickSound(); resetAllSystemData()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow border border-rose-400/30">
                            <i class="fa-solid fa-rotate-right ml-1"></i> تصفير وحذف كافة الحسابات
                        </button>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="bg-black/20 dark:bg-slate-900/50 p-4 rounded-2xl border border-white/20 dark:border-slate-700 text-center"><span class="text-xs text-gray-300 block mb-1">إجمالي الطلاب</span><span class="text-xl font-black text-blue-300">${students.length}</span></div>
                        <div class="bg-black/20 dark:bg-slate-900/50 p-4 rounded-2xl border border-white/20 dark:border-slate-700 text-center"><span class="text-xs text-gray-300 block mb-1">طلبات الحضور المعلقة</span><span class="text-xl font-black text-amber-300">${pendingAttendance.length}</span></div>
                        <div class="bg-black/20 dark:bg-slate-900/50 p-4 rounded-2xl border border-white/20 dark:border-slate-700 text-center"><span class="text-xs text-gray-300 block mb-1">طلبات الدفع المعلقة</span><span class="text-xl font-black text-indigo-300">${pendingPayments.length}</span></div>
                        <div class="bg-black/20 dark:bg-slate-900/50 p-4 rounded-2xl border border-white/20 dark:border-slate-700 text-center"><span class="text-xs text-gray-300 block mb-1">صافي الخزينة</span><span class="text-xl font-black text-emerald-300">${netProfit} ج</span></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div class="bg-emerald-950/40 p-4 rounded-2xl border border-emerald-500/30 text-center"><span class="text-xs text-emerald-300 block">إيرادات محصلة</span><span class="text-lg font-black text-emerald-200">${totalRev} ج.م</span></div>
                        <div class="bg-rose-950/40 p-4 rounded-2xl border border-rose-500/30 text-center"><span class="text-xs text-rose-300 block">مصروفات مسجلة</span><span class="text-lg font-black text-rose-200">${totalExp} ج.م</span></div>
                        <div class="bg-blue-950/40 p-4 rounded-2xl border border-blue-500/30 text-center"><span class="text-xs text-blue-300 block">حضور معتمد</span><span class="text-lg font-black text-blue-200">${approvedAttendance.length} حصة</span></div>
                        <div class="bg-purple-950/40 p-4 rounded-2xl border border-purple-500/30 flex flex-col justify-center items-center"><span class="text-xs text-purple-300 mb-1">التقارير الشاملة</span><button onclick="playClickSound(); openReportsModal()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl text-xs font-bold transition shadow">عرض وطباعة</button></div>
                    </div>

                    <div class="bg-black/20 dark:bg-slate-900/60 p-5 rounded-2xl border border-white/20 dark:border-slate-700 space-y-3">
                        <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-user-plus ml-1"></i> تسجيل طالب جديد بالبوابة:</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="text" id="new-st-name" placeholder="اسم الطالب الرباعي" class="px-3 py-2.5 border rounded-xl text-xs bg-black/30 dark:bg-slate-950 text-white placeholder-gray-300 border-white/30 dark:border-slate-700">
                            <input type="text" id="new-st-phone" placeholder="رقم الهاتف (واتساب)" class="px-3 py-2.5 border rounded-xl text-xs bg-black/30 dark:bg-slate-950 text-white placeholder-gray-300 border-white/30 dark:border-slate-700" dir="ltr">
                            <button onclick="playClickSound(); addNewStudentFromPanel()" class="bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold text-xs shadow transition">إضافة وتوليد كود YOSSR</button>
                        </div>
                    </div>

                    <!-- إدارة الحضور المعلق -->
                    <div class="bg-black/20 dark:bg-slate-900/60 p-5 rounded-2xl border border-white/20 dark:border-slate-700 space-y-3">
                        <h3 class="font-bold text-sm text-amber-300"><i class="fa-solid fa-clipboard-user ml-1"></i> مراجعة واعتماد طلبات الحضور المعلقة (${pendingAttendance.length}):</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-right border-collapse">
                                <thead><tr class="border-b border-white/20 text-gray-300"><th class="p-2.5">اسم الطالب</th><th class="p-2.5">الكود</th><th class="p-2.5">وقت الطلب</th><th class="p-2.5 text-center">الإجراء</th></tr></thead>
                                <tbody class="divide-y divide-white/10">
                                    ${pendingAttendance.length === 0 ? `<tr><td colspan="4" class="p-3 text-center text-gray-400">لا توجد طلبات حضور معلقة حالياً.</td></tr>` : 
                                        pendingAttendance.map((item, idx) => `<tr class="hover:bg-white/5"><td class="p-2.5 font-bold">${item.name}</td><td class="p-2.5 font-mono">${item.code}</td><td class="p-2.5 text-gray-300">${item.date}</td><td class="p-2.5 text-center flex justify-center gap-1.5"><button onclick="approveAttendance(${idx})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-bold">قبول</button><button onclick="rejectAttendance(${idx})" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg font-bold">رفض</button></td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- إدارة السداد المعلق -->
                    <div class="bg-black/20 dark:bg-slate-900/60 p-5 rounded-2xl border border-white/20 dark:border-slate-700 space-y-3">
                        <h3 class="font-bold text-sm text-indigo-300"><i class="fa-solid fa-file-invoice-dollar ml-1"></i> مراجعة طلبات السداد والدفع المعلقة (${pendingPayments.length}):</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-right border-collapse">
                                <thead><tr class="border-b border-white/20 text-gray-300"><th class="p-2.5">الطالب</th><th class="p-2.5">البند</th><th class="p-2.5">المادة والشهر</th><th class="p-2.5">المبلغ</th><th class="p-2.5 text-center">الإجراء</th></tr></thead>
                                <tbody class="divide-y divide-white/10">
                                    ${pendingPayments.length === 0 ? `<tr><td colspan="5" class="p-3 text-center text-gray-400">لا توجد طلبات سداد معلقة حالياً.</td></tr>` : 
                                        pendingPayments.map((item, idx) => `<tr class="hover:bg-white/5"><td class="p-2.5 font-bold">${item.name} (${item.code})</td><td class="p-2.5 text-indigo-300">${item.type}</td><td class="p-2.5">${item.subject} - ${item.month}</td><td class="p-2.5 font-bold text-emerald-400">${item.amount} ج</td><td class="p-2.5 text-center flex justify-center gap-1.5"><button onclick="approvePayment(${idx})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-bold">قبول وإضافة</button><button onclick="rejectPayment(${idx})" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg font-bold">رفض</button></td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- سجل الطلاب -->
                    <div class="bg-black/20 dark:bg-slate-900/60 p-5 rounded-2xl border border-white/20 dark:border-slate-700 space-y-3">
                        <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-users ml-1"></i> سجل الطلاب المسجلين (${students.length}):</h3>
                        <div class="overflow-x-auto max-h-60 overflow-y-auto">
                            <table class="w-full text-xs text-right border-collapse">
                                <thead><tr class="border-b border-white/20 text-gray-300 sticky top-0 bg-slate-900/90"><th class="p-2.5">اسم الطالب</th><th class="p-2.5">الكود</th><th class="p-2.5">رقم الهاتف</th><th class="p-2.5 text-center">الإجراءات</th></tr></thead>
                                <tbody class="divide-y divide-white/10">
                                    ${students.map((st, index) => `<tr class="hover:bg-white/5"><td class="p-2.5 font-bold">${st.name}</td><td class="p-2.5 font-mono">${st.code}</td><td class="p-2.5 text-emerald-300 font-mono" dir="ltr">${st.phone}</td><td class="p-2.5 text-center flex justify-center gap-1.5"><button onclick="showStudentCardModal('${st.name}', '${st.code}')" class="bg-sky-600 text-white px-2.5 py-1 rounded-lg">الكارنيه</button><button onclick="deleteStudent(${index})" class="bg-rose-600 text-white px-2.5 py-1 rounded-lg">حذف</button></td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function resetAllSystemData() {
            if (confirm("⚠️ تحذير: هل أنت متأكد تماماً من رغبتك في تصفير وحذف جميع البيانات والطلاب والطلبات المعلقة؟ لا يمكن التراجع عن هذا الإجراء.")) {
                localStorage.clear();
                alert("تم تصفير النظام بنجاح.");
                renderAdminView();
            }
        }

        function addNewStudentFromPanel() {
            const name = document.getElementById('new-st-name').value.trim();
            const phone = document.getElementById('new-st-phone').value.trim() || "غير محدد";
            if(!name) { alert("أدخل اسم الطالب أولاً!"); return; }
            
            let students = getData('yossr_students', []);
            const randomCode = "YOSSR-" + Math.floor(100 + Math.random() * 900);
            students.push({ name, code: randomCode, phone, active: true });
            saveData('yossr_students', students);
            renderAdminView();
            alert("تم إضافة الطالب بنجاح برمز تعريف: " + randomCode);
        }

        function approveAttendance(idx) {
            let pending = getData('yossr_pending_att', []);
            let approved = getData('yossr_approved_att', []);
            let item = pending.splice(idx, 1)[0];
            if(item) {
                approved.push({ name: item.name, code: item.code, date: new Date().toLocaleString('ar-EG') });
                saveData('yossr_pending_att', pending);
                saveData('yossr_approved_att', approved);
                renderAdminView();
            }
        }

        function rejectAttendance(idx) {
            let pending = getData('yossr_pending_att', []);
            pending.splice(idx, 1);
            saveData('yossr_pending_att', pending);
            renderAdminView();
        }

        function approvePayment(idx) {
            let pending = getData('yossr_pending_pay', []);
            let subs = getData('yossr_subscriptions', []);
            let item = pending.splice(idx, 1)[0];
            if(item) {
                subs.push({ name: item.name, code: item.code, subject: item.subject, month: item.month, amount: item.amount, date: new Date().toLocaleString('ar-EG') });
                saveData('yossr_pending_pay', pending);
                saveData('yossr_subscriptions', subs);
                renderAdminView();
            }
        }

        function rejectPayment(idx) {
            let pending = getData('yossr_pending_pay', []);
            pending.splice(idx, 1);
            saveData('yossr_pending_pay', pending);
            renderAdminView();
        }

        function deleteStudent(index) {
            let students = getData('yossr_students', []);
            if (confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
                students.splice(index, 1);
                saveData('yossr_students', students);
                renderAdminView();
            }
        }

        function openReportsModal() {
            let subs = getData('yossr_subscriptions', []);
            let expenses = getData('yossr_expenses', []);
            let totalRev = subs.reduce((sum, s)=>sum+s.amount, 0);
            let totalExp = expenses.reduce((sum, e)=>sum+e.amount, 0);
            let netProfit = totalRev - totalExp;

            const area = document.getElementById('print-card-area');
            area.className = "fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto";
            area.innerHTML = `
                <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-2xl text-right space-y-5 shadow-2xl text-white my-8">
                    <div class="flex justify-between items-center border-b pb-3 border-slate-700">
                        <h3 class="text-lg font-black text-purple-400"><i class="fa-solid fa-file-lines ml-1"></i> التقرير المالي والإحصائي الشامل</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div class="grid grid-cols-3 gap-3 text-center">
                        <div class="bg-emerald-950/60 p-3 rounded-xl border border-emerald-500/30"><span class="text-[11px] text-emerald-300 block">الإيرادات</span><span class="font-black text-emerald-200">${totalRev} ج.م</span></div>
                        <div class="bg-rose-950/60 p-3 rounded-xl border border-rose-500/30"><span class="text-[11px] text-rose-300 block">المصروفات</span><span class="font-black text-rose-200">${totalExp} ج.م</span></div>
                        <div class="bg-blue-950/60 p-3 rounded-xl border border-blue-500/30"><span class="text-[11px] text-blue-300 block">الصافي</span><span class="font-black text-blue-200">${netProfit} ج.م</span></div>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="window.print()" class="flex-1 bg-purple-600 hover:bg-purple-700 py-2.5 rounded-xl text-xs font-bold transition">طباعة التقرير</button>
                        <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-800 py-2.5 rounded-xl text-xs font-bold transition">إغلاق</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
