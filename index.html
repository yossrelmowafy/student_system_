<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحضور والمدفوعات - Mr. Yossr ElMowafy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-cyan-400">Mr. Yossr ElMowafy</h1>
                <p class="text-slate-400 text-sm mt-1">نظام إدارة الحضور والتحصيل والتقييم اللحظي (المحاسبة وإدارة الأعمال)</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">نسخ احتياطي (JSON)</button>
                <label class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition cursor-pointer">
                    استرجاع بيانات <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Control Panel -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-xl font-bold text-cyan-400 mb-4">لوحة تحكم الطالب / توليد QR</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">اسم الطالب ثلاثي</label>
                            <input type="text" id="studentName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500" placeholder="أدخل اسم الطالب">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">المجموعة / الموعد</label>
                            <select id="studentGroup" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                                <option value="مجموعة السبت والأربعاء - 4 عصراً">مجموعة السبت والأربعاء - 4 عصراً</option>
                                <option value="مجموعة الأحد والثلاثاء - 6 مساءً">مجموعة الأحد والثلاثاء - 6 مساءً</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-300 mb-1">نوع الدفع / المعاملة</label>
                            <select id="paymentType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                                <option value="اشتراك (شهرى)">اشتراك (شهرى)</option>
                                <option value="رسوم (حصة / تسجيل)">رسوم (حصة / تسجيل)</option>
                                <option value="امتحان">امتحان</option>
                            </select>
                        </div>
                        <button onclick="generateStudentQR()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">توليد كود الحضور الخاص</button>
                    </div>

                    <!-- QR Display Box -->
                    <div id="qrContainer" class="mt-6 hidden flex flex-col items-center justify-center bg-slate-900 p-4 rounded-xl border border-slate-700">
                        <div id="qrcode" class="bg-white p-3 rounded-lg mb-3"></div>
                        <p id="qrStudentTitle" class="text-sm font-semibold text-slate-300 mb-3 text-center"></p>
                        <button onclick="downloadQRImage()" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 border border-cyan-500/30 px-4 py-2 rounded-xl text-sm font-semibold transition w-full">تحميل صورة الـ QR</button>
                    </div>
                </div>

                <!-- Live Schedule Widget -->
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-cyan-400">مواعيد الحصص (تحديث لحظي)</h2>
                        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    </div>
                    <div id="liveSchedule" class="space-y-3 text-sm"></div>
                </div>
            </div>

            <!-- Attendance Records Table -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                        <h2 class="text-xl font-bold text-cyan-400">سجل الحضور والمدفوعات الفوري</h2>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="بحث باسم الطالب..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 w-full sm:w-64">
                            <button onclick="clearRecords()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 px-4 py-2 rounded-xl text-sm font-semibold transition">حذف السجل</button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="border-b border-slate-700 text-slate-400 text-sm">
                                    <th class="py-3 px-4">اسم الطالب</th>
                                    <th class="py-3 px-4">المجموعة</th>
                                    <th class="py-3 px-4">نوع الدفع</th>
                                    <th class="py-3 px-4">وقت التسجيل</th>
                                    <th class="py-3 px-4 text-center">الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceTableBody" class="divide-y divide-slate-700/50 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/YOUR_GROUP_LINK_HERE";
        const WELCOME_MESSAGE = "أهلاً بك يا بطل في مادة المحاسبة وإدارة الأعمال مع مستر يسر الموافي! سعيد جداً بوجودك معنا، ومتأكد إنك هتقفل المادة. بالتوفيق دائماً!";

        let attendanceRecords = JSON.parse(localStorage.getItem('yossr_attendance')) || [];
        let currentSchedule = [
            { name: "مجموعة السبت والأربعاء", time: "السبت والأربعاء - 04:00 عصراً", status: "متاح الآن" },
            { name: "مجموعة الأحد والثلاثاء", time: "الأحد والثلاثاء - 06:00 مساءً", status: "قريباً" }
        ];

        window.onload = function() {
            renderTable();
            renderSchedule();
            checkUrlScan();
            setInterval(updateRealtimeSchedule, 60000);
        };

        function renderTable() {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';
            
            if(attendanceRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">لا توجد سجلات حضور حتى الآن</td></tr>`;
                return;
            }

            attendanceRecords.slice().reverse().forEach((record) => {
                let badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                if(record.payment === 'رسوم (حصة / تسجيل)') badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                if(record.payment === 'امتحان') badgeColor = "bg-purple-500/10 text-purple-400 border-purple-500/20";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-white">${record.name}</td>
                    <td class="py-3 px-4 text-slate-300">${record.group}</td>
                    <td class="py-3 px-4"><span class="border px-2.5 py-1 rounded-lg text-xs font-bold ${badgeColor}">${record.payment || 'اشتراك'}</span></td>
                    <td class="py-3 px-4 text-slate-400">${record.time}</td>
                    <td class="py-3 px-4 text-center"><span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold">حاضر</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        let qrcodeInstance = null;
        function generateStudentQR() {
            const name = document.getElementById('studentName').value.trim();
            const group = document.getElementById('studentGroup').value;
            const payment = document.getElementById('paymentType').value;

            if(!name) {
                alert('برجاء كتابة اسم الطالب أولاً!');
                return;
            }

            document.getElementById('qrContainer').classList.remove('hidden');
            document.getElementById('qrStudentTitle').innerText = `${name} - ${group} (${payment})`;
            
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            
            const currentUrl = window.location.href.split('?')[0];
            const scanData = `${currentUrl}?scan=true&name=${encodeURIComponent(name)}&group=${encodeURIComponent(group)}&payment=${encodeURIComponent(payment)}`;

            qrcodeInstance = new QRCode(qrDiv, {
                text: scanData,
                width: 160,
                height: 160,
                colorDark: "#020617",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQRImage() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if(!qrCanvas) {
                alert('قم بتوليد الكود أولاً!');
                return;
            }
            const imageURI = qrCanvas.toDataURL("image/png");
            const studentName = document.getElementById('studentName').value.trim() || 'student';
            const link = document.createElement('a');
            link.href = imageURI;
            link.download = `QR_Code_${studentName}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function checkUrlScan() {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('scan') === 'true') {
                const name = decodeURIComponent(urlParams.get('name') || '');
                const group = decodeURIComponent(urlParams.get('group') || '');
                const payment = decodeURIComponent(urlParams.get('payment') || 'اشتراك');
                
                if(name) {
                    const now = new Date();
                    const timeString = now.toLocaleDateString('ar-EG') + ' - ' + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
                    
                    const alreadyExists = attendanceRecords.some(r => r.name === name && r.time === timeString);
                    if(!alreadyExists) {
                        attendanceRecords.push({ name, group, payment, time: timeString });
                        localStorage.setItem('yossr_attendance', JSON.stringify(attendanceRecords));
                    }

                    document.body.innerHTML = `
                        <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl space-y-5">
                                <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
                                <div>
                                    <h2 class="text-2xl font-bold text-white mb-1">تم تسجيل حضورك وتسجيل الـ (${payment}) بنجاح!</h2>
                                    <p class="text-cyan-400 font-bold text-lg">${name}</p>
                                    <p class="text-slate-400 text-xs mt-1">${group}</p>
                                </div>
                                
                                <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-2xl text-slate-200 text-sm leading-relaxed text-right">
                                    <p class="font-bold text-cyan-300 mb-1">رسالة ترحيبية من مستر يسر:</p>
                                    <p>${WELCOME_MESSAGE}</p>
                                </div>

                                <a href="${WHATSAPP_GROUP_LINK}" target="_blank" class="block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 text-center">
                                    انضم لجروب الواتساب الرسمي 📱
                                </a>

                                <div class="pt-2 border-t border-slate-800 text-xs text-slate-500">نظام مستر يسر الموافي للمحاسبة وإدارة الأعمال</div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        function renderSchedule() {
            const container = document.getElementById('liveSchedule');
            container.innerHTML = '';
            currentSchedule.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-700/60 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <p class="font-semibold text-white">${item.name}</p>
                            <p class="text-xs text-slate-400 mt-0.5">${item.time}</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${item.status === 'متاح الآن' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400'}">${item.status}</span>
                    </div>
                `;
            });
        }

        function updateRealtimeSchedule() {
            renderSchedule();
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#attendanceTableBody tr');
            rows.forEach(row => {
                const nameText = row.cells[0]?.textContent.toLowerCase() || '';
                row.style.display = nameText.includes(query) ? '' : 'none';
            });
        }

        function clearRecords() {
            if(confirm('هل أنت متأكد من مسح كافة سجلات الحضور؟')) {
                attendanceRecords = [];
                localStorage.removeItem('yossr_attendance');
                renderTable();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(attendanceRecords));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "yossr_attendance_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            $file = event.target.files[0];
            if (!$file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(Array.isArray(imported)) {
                        attendanceRecords = imported;
                        localStorage.setItem('yossr_attendance', JSON.stringify(attendanceRecords));
                        renderTable();
                        alert('تم استرجاع البيانات بنجاح!');
                    } else {
                        alert('ملف غير صالح!');
                    }
                } catch (err) {
                    alert('خطأ في قراءة الملف!');
                }
            };
            reader.readAsText($file);
        }
    </script>
</body>
</html>
